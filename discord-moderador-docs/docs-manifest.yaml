  data-dictionary:  { path_pattern: "docs/03-data/data-dictionary.md",     max_age_days: 120 }
  er-model:         { path_pattern: "docs/03-data/er-diagrams/*.dbml",      max_age_days: 120 }
  test-data-matrix: { path_pattern: "docs/03-data/test-data-matrix.md",     max_age_days: 120 }
  architecture:     { path_pattern: "docs/01-architecture/*.md",            max_age_days: 180 }
  adr-catalog:      { path_pattern: "docs/04-decisions/README.md",          max_age_days: 365 }
  api-catalog:      { path_pattern: "docs/05-apis/catalog.md",              max_age_days: 180 }
  runbook:          { path_pattern: "docs/07-operations/*.md",              max_age_days: 180 }

# Piezas del Marco §5.2 declaradas como NO aplicables a esta solución (omisión explícita, arc42):
omitido_declarado:
  - path: docs/02-requirements/functional (SRS por módulo)
    razon: >-
      La especificación funcional autoritativa ya existe en la SDD 2.2 (16 casos de uso, 16 reglas de
      negocio). Este set la referencia por ID en docs/02-requirements/README.md en lugar de duplicarla.
  - path: docs/05-apis/openapi.yaml
    razon: >-
      La pieza no expone una REST API pública. Solo tiene endpoints internos minimal-API de
      autenticación del panel (mismo origen), catalogados en docs/05-apis/catalog.md sin contrato OpenAPI.
  - path: docs/01-architecture (03-deployment como diagrama binario)
    razon: Los diagramas se expresan como código Mermaid; no se generan imágenes binarias.
  - path: docs/06-security-compliance/regulatory-mapping.md
    razon: solution.regulated = false; ver nota_regulacion y docs/06-security-compliance/data-protection.md.

agent_policy: docs/09-agents/agent-policy.md
