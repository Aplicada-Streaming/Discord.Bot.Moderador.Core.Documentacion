# Manifiesto de documentación (Marco §12.2) — máquina-legible.
# Un agente calcula el gap documental (requerido − existente − vencido) leyendo solo este archivo
# más el frontmatter de cada .md. Estado inicial: draft (generado por ingeniería inversa).
# Generado por /IA.Prompting.Templates/Tool-Prompts/Documentar-Fuentes-Software.md el 2026-07-15.

solution:
  name: administrador-bots-moderador-discord
  display_name: Administrador de Bots Moderador para Discord
  repo: Discord.Bot.Moderador.Core
  regulated: false            # No hay perfil de dominio regulado activo (A.17). Ver nota_regulacion.
  nota_regulacion: >-
    Trata identificadores y copias de mensajes de Discord como evidencia. Existe una decisión de
    cumplimiento respecto de la Ley argentina 25.326 (ADR-06), documentada como consideración de
    seguridad/retención, no como perfil regulado formal.
  version_scheme: nerdbank-gitversioning   # version.json = 1.0, sin tags aún
  status: v1-funcionalmente-completo
  source_of_truth: ../Discord.Bot.Moderador.Core        # código = fuente de verdad
  secondary_source: ../Discord.Bot.Moderador.Core/SDD2.2D/docs   # SDD 2.2 (citar, no copiar)

pieces:
  - id: discordmoderadorbot-servicio
    type: web-monolith          # combina web-portal + service/worker + database (Marco §7, §5.1)
    combines: [web-portal, service, worker, database]
    path: src/DiscordModeradorBot.Servicio
    docs_root: docs/pieces/discordmoderadorbot-servicio/
    tech: [dotnet-10, blazor-server, mudblazor, discord-net, ef-core, sqlite]
    criticality: high
    deployable: true
    required_docs: [readme, architecture-local, configuration, snippets, changelog]
    modules:
      - { name: Dominio,        path: src/DiscordModeradorBot.Servicio/Dominio,        role: nucleo-puro }
      - { name: Aplicacion,     path: src/DiscordModeradorBot.Servicio/Aplicacion,     role: orquestacion, profile: service }
      - { name: Infraestructura,path: src/DiscordModeradorBot.Servicio/Infraestructura,role: adaptadores,  profile: worker+database }
      - { name: Components,     path: src/DiscordModeradorBot.Servicio/Components,     role: panel,        profile: web-portal }
  - id: servicio-tests
    type: support-tests
    path: tests/DiscordModeradorBot.Servicio.Tests
    tech: [xunit, fluentassertions, nsubstitute]
    deployable: false
    required_docs: []           # cubierto en la doc de la pieza (sección pruebas) y en la ia-db
  - id: servicio-e2e
    type: support-tests
    path: tests/DiscordModeradorBot.Servicio.E2E
    tech: [playwright]
    deployable: false
    required_docs: []
  - id: servicio-benchmarks
    type: support-perf
    path: perf/DiscordModeradorBot.Servicio.Benchmarks
    tech: [benchmarkdotnet]
    deployable: false
    required_docs: []

